# La CI de l'extension, sur chaque PR et sur main.
#
# Les gestes qu'on ferait avant de signer l'extension : les tests, ESLint et le
# format, la validation du manifeste par l'outil de Mozilla (web-ext lint, qui
# échoue sur un avertissement — comme publication.yml, sans quoi une PR verte
# pourrait bloquer la publication après sa fusion), la fiche addons.mozilla.org
# et le paquet de déploiement (npm run paquet, sans signature : les clés ne
# servent qu'à publication.yml).
#
# Le nom du job est un contexte exigé par le ruleset (CHECKS de
# scripts/apply-rulesets.mjs, dans dev-pwa-config) : le renommer gèlerait toutes
# les PR du dépôt. Pas de matrice, pas d'apostrophe : un nom stable.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    name: Tests, lint et paquet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: node --version && npm --version

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - run: npm run lint:js

      - run: npm run format:check

      - run: npm run lint -- --warnings-as-errors

      - run: node scripts/fiche-amo.mjs --verifier

      - run: npm run paquet
