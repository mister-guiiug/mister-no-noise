# CI locale-ready : tests, ESLint, web-ext lint, build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    name: Tests, lint et paquet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: node --version && npm --version

      - run: npm ci

      - run: npm test

      - run: npm run lint:js

      - run: npm run lint

      - run: npm run build
