# La fiche addons.mozilla.org, tenue par le dépôt (scripts/fiche-amo.mjs).
# Secrets : AMO_API_KEY et AMO_API_SECRET.
name: Fiche AMO

on:
  push:
    branches: [main]
    paths:
      - "amo/**"
      - "extension/_locales/*/messages.json"
      - "extension/icons/icone-128.png"
      - "scripts/fiche-amo.mjs"
      - "scripts/amo.mjs"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      supprimer:
        description: "Captures à retirer de la fiche avant l'envoi (identifiants, séparés par des virgules)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fiche-amo
  cancel-in-progress: false

jobs:
  captures:
    name: Fiche addons.mozilla.org
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/fiche-amo.mjs --verifier

      - name: Envoi sur addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          SUPPRIMER: ${{ inputs.supprimer }}
        run: node scripts/fiche-amo.mjs
