<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>No Noise</title>
</head>
<body>
  <header class="hd">
    <img src="../../icons/icon.svg" class="logo" alt="">
    <div class="ht">
      <strong data-i18n="extShortName">No Noise</strong>
      <span data-i18n="appSubtitle">History Cleaner</span>
    </div>
    <label class="master" data-i18n-title="masterTitle" title="Enable / disable the extension">
      <input type="checkbox" id="enabled">
      <span class="switch"></span>
    </label>
  </header>

  <div id="dry" class="banner hidden" data-i18n="bannerDryRun">Simulation mode — no actual deletion</div>

  <section class="grid">
    <button id="cleanNow" class="btn primary" data-i18n="cleanNow">Clean now</button>
    <button id="preview" class="btn" data-i18n="preview">Preview</button>
  </section>

  <div id="confirm" class="confirm hidden">
    <span id="confirmMsg"></span>
    <div class="confirm-btns">
      <button id="confirmYes" class="btn danger" data-i18n="confirmYes">Delete</button>
      <button id="confirmNo" class="btn" data-i18n="cancel">Cancel</button>
    </div>
  </div>

  <div id="result" class="result hidden"></div>

  <section class="toggles">
    <label class="row"><span data-i18n="toggleRealtime">Real-time (adaptive)</span>
      <span class="sw"><input type="checkbox" id="realtime"><span class="switch sm"></span></span></label>
    <label class="row"><span data-i18n="togglePeriodic">Periodic sweep</span>
      <span class="sw"><input type="checkbox" id="periodic"><span class="switch sm"></span></span></label>
    <label class="row"><span data-i18n="toggleDryRun">Simulation (dry-run)</span>
      <span class="sw"><input type="checkbox" id="dryRun"><span class="switch sm"></span></span></label>
  </section>

  <section class="stats">
    <div><b id="stTotal">0</b><span data-i18n="statTotal">deleted in total</span></div>
    <div><b id="stRules">0</b><span data-i18n="statRules">active rules</span></div>
  </section>
  <div class="last" id="stLast"></div>

  <footer>
    <a href="#" id="openOptions" data-i18n="openOptions">Manage rules and settings &rarr;</a>
  </footer>

  <script src="../common/compat.js"></script>
  <script src="../common/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
