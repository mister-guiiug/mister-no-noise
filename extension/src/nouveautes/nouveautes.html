<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>No Noise</title>
  <link rel="icon" href="../../icons/icone.svg">
  <link rel="stylesheet" href="nouveautes.css">
</head>
<body>
  <main>
    <header>
      <img src="../../icons/icone.svg" alt="" width="32" height="32">
      <h1 id="titre"></h1>
    </header>

    <section class="card">
      <h2 data-i18n="nouveautesQuoiDeNeuf">What’s new</h2>
      <ul id="points"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="nouveautesDemarrer">Get started</h2>
      <p data-i18n="nouveautesDemarrerTexte">Scan your history to find noisy domains, or add a ready-made rule pack.</p>
      <div class="run">
        <button type="button" id="ouvrir" class="btn primary" data-i18n="openOptions">Manage rules and settings →</button>
      </div>
    </section>

    <p class="ft" data-i18n="footer">No Noise — your data never leaves your browser.</p>
  </main>
  <script src="../common/compat.js"></script>
  <script src="../common/core.js"></script>
  <script src="nouveautes.js"></script>
</body>
</html>
